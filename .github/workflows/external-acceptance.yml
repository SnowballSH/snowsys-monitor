name: external-acceptance

on:
  schedule:
    # Off-peak minutes: GitHub throttles the crowded :00/:30 slots, which
    # silently starved this schedule during load (10+ hour gap observed
    # 2026-08-27). Same 30-minute cadence, quieter slots.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: Add one check that always fails, to prove a red run emails the owner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: external-acceptance
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Black-box acceptance matrix
        env:
          FORCE_FAILURE: ${{ inputs.force_failure }}
        run: |
          set -uo pipefail

          checks=0
          failures=0

          # Each check retries once after 10 s so a single network blip does
          # not page anyone; a persistent failure turns the run red and
          # GitHub emails the owner.
          check() {
            local name="$1"
            shift
            checks=$((checks + 1))
            if "$@" >/dev/null 2>&1; then
              echo "ok   ${name}"
              return
            fi
            sleep 10
            if "$@" >/dev/null 2>&1; then
              echo "ok   ${name} (after retry)"
              return
            fi
            echo "FAIL ${name}"
            failures=$((failures + 1))
          }

          expect_status() {
            local expected="$1" url="$2" got
            got="$(curl -s -o /dev/null --max-time 15 -w '%{http_code}' "${url}")"
            [ "${got}" = "${expected}" ]
          }

          expect_redirect() {
            local target="$1" url="$2" got
            got="$(curl -s -o /dev/null --max-time 15 -w '%{redirect_url}' "${url}")"
            [ "${got}" = "${target}" ]
          }

          body_contains() {
            local needle="$1" url="$2" body
            body="$(curl -s --max-time 15 "${url}")" || return 1
            case "${body}" in *"${needle}"*) return 0 ;; *) return 1 ;; esac
          }

          json_satisfies() {
            local filter="$1" url="$2" response body status
            response="$(curl --fail --silent --show-error --max-time 15 \
              --write-out $'\n%{http_code}' "${url}")" || return 1
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            [ "${status}" = "200" ] || return 1
            jq -e "${filter}" >/dev/null <<<"${body}"
          }

          header_contains() {
            local needle="$1" url="$2"
            curl -sI --max-time 15 "${url}" | grep -qi "${needle}"
          }

          # --- apex ---------------------------------------------------------
          check "apex 200"                 expect_status 200 https://snowballsh.com/
          check "apex served by Caddy"     header_contains 'server: Caddy' https://snowballsh.com/
          check "apex canonical tag"       body_contains '<link rel="canonical" href="https://snowballsh.com/">' https://snowballsh.com/
          check "apex health ready"        body_contains 'ok' https://snowballsh.com/health/ready
          check "styled 404"               body_contains 'This page melted away' https://snowballsh.com/snowsys-monitor-absent
          check "404 status"               expect_status 404 https://snowballsh.com/snowsys-monitor-absent
          check "blogs prefix 301"         expect_status 301 https://snowballsh.com/blogs/
          check "blogs prefix target"      expect_redirect 'https://blogs.snowballsh.com/' https://snowballsh.com/blogs/
          check "sitemap on apex"          body_contains 'https://snowballsh.com/sitemap-0.xml' https://snowballsh.com/sitemap-index.xml
          check "robots on apex"           body_contains 'Sitemap: https://snowballsh.com/sitemap-index.xml' https://snowballsh.com/robots.txt

          # --- redirects ----------------------------------------------------
          check "http to https"            expect_redirect 'https://snowballsh.com/' http://snowballsh.com/
          check "www to apex"              expect_redirect 'https://snowballsh.com/' https://www.snowballsh.com/
          check "project path to github.io" expect_redirect 'https://snowballsh.github.io/Gorilla/' https://snowballsh.com/Gorilla/
          check "github.io stub redirect"  body_contains 'location.replace' https://snowballsh.github.io/
          check "rimehand 200"             expect_status 200 https://rimehand.snowballsh.com/

          # --- identity planes ----------------------------------------------
          check "headscale health"         expect_status 200 https://headscale.snowballsh.com/health
          check "authelia discovery"       body_contains '"issuer":"https://auth.snowballsh.com"' https://auth.snowballsh.com/.well-known/openid-configuration
          check "admin network gate"       body_contains 'not available on this network' https://admin.snowballsh.com/
          check "admin network gate 403"   expect_status 403 https://admin.snowballsh.com/

          # --- blog API ----------------------------------------------------
          check "blog API health"          json_satisfies '.database == "ok"' https://api.blogs.snowballsh.com/api/v1/health
          check "blog API posts nonempty"  json_satisfies '.posts | type == "array" and length > 0' https://api.blogs.snowballsh.com/api/v1/posts
          check "blog public admin hidden" expect_status 404 https://api.blogs.snowballsh.com/api/v1/admin/posts
          check "blog admin network gate"  expect_status 403 https://blogs-admin.snowballsh.com/api/v1/health

          # --- blog frontend (Phase 8.7) ------------------------------------
          check "blogs homepage brand"     body_contains 'SnowballSH Blogs' https://blogs.snowballsh.com/
          check "blogs math post 200"      expect_status 200 https://blogs.snowballsh.com/posts/fun_integral_1
          check "blogs admin unrouted"     expect_status 404 https://blogs.snowballsh.com/api/v1/admin/posts
          check "blogs asset via origin"   expect_status 200 https://blogs.snowballsh.com/api/v1/posts/college_year_1/assets/assets/nyc_times_square.jpg

          # --- Foundation UI ------------------------------------------------
          check "foundationui homepage"    body_contains '<title>Foundation UI</title>' https://foundationui.snowballsh.com/
          check "foundationui liveness"    expect_status 200 https://foundationui.snowballsh.com/health/live

          # --- file serving (Phase 10) --------------------------------------
          check "static canary 200"        body_contains 'snowsys-files-canary-v1' https://static.snowballsh.com/canary.txt
          check "static directory hidden"  expect_status 404 https://static.snowballsh.com/canary/
          check "files network gate"       body_contains 'not available on this network' https://files.snowballsh.com/
          check "files network gate 403"   expect_status 403 https://files.snowballsh.com/

          # --- tailnet-gated operator surfaces ------------------------------
          # Grafana (Phase 8.6) and the deploy UI (Phase 11.5) exist only for
          # a tailnet source; from the public Internet each must refuse before
          # Authelia is ever consulted. A 302 here would mean the source gate
          # has fallen away and the login page is public.
          check "grafana network gate 403" expect_status 403 https://grafana.snowballsh.com/
          check "deploy network gate 403"  expect_status 403 https://deploy.snowballsh.com/
          check "deploy API network gate"  expect_status 403 https://deploy.snowballsh.com/api/v1/services

          # Phase 12 LLM gateway (D038): bearer keys are the public boundary;
          # llm-admin sits behind the tailnet source gate.
          check "llm unauthenticated 401"  expect_status 401 https://llm.snowballsh.com/v1/models
          check "llm unknown route 404"    expect_status 404 https://llm.snowballsh.com/
          check "llm-admin network gate"   expect_status 403 https://llm-admin.snowballsh.com/

          # Kami (D042): a public game whose own password is the boundary;
          # health answers without a session, the board list refuses without one.
          check "kami health"              json_satisfies '.ok == true' https://kami.snowballsh.com/api/health
          check "kami boards need sign-in" expect_status 401 https://kami.snowballsh.com/api/boards

          # --- DNS ----------------------------------------------------------
          dns_a_is_eip() {
            [ "$(dig +short @1.1.1.1 snowballsh.com A | head -1)" = "3.225.113.178" ]
          }
          dns_aaaa_absent() {
            [ -z "$(dig +short @1.1.1.1 snowballsh.com AAAA)" ]
          }
          dns_mx_migadu() {
            dig +short @1.1.1.1 snowballsh.com MX | grep -q 'migadu.com'
          }
          check "apex A is the EIP"        dns_a_is_eip
          check "apex AAAA absent"         dns_aaaa_absent
          check "MX still Migadu"          dns_mx_migadu

          # --- TLS expiry margin (>= 21 days), every public vhost -----------
          # Gated names answer 403 over HTTPS; the handshake is what this
          # validates, so the gate does not matter here.
          cert_margin_ok() {
            local name="$1" not_after expiry now
            not_after="$(echo | openssl s_client -servername "${name}" \
              -connect "${name}:443" 2>/dev/null |
              openssl x509 -noout -enddate | cut -d= -f2)"
            [ -n "${not_after}" ] || return 1
            expiry="$(date -d "${not_after}" +%s)"
            now="$(date +%s)"
            [ $(((expiry - now) / 86400)) -ge 21 ]
          }
          tls_names="
            snowballsh.com
            www.snowballsh.com
            test.snowballsh.com
            headscale.snowballsh.com
            auth.snowballsh.com
            admin.snowballsh.com
            api.blogs.snowballsh.com
            blogs.snowballsh.com
            blogs-admin.snowballsh.com
            foundationui.snowballsh.com
            static.snowballsh.com
            files.snowballsh.com
            grafana.snowballsh.com
            deploy.snowballsh.com
            llm.snowballsh.com
            llm-admin.snowballsh.com
            kami.snowballsh.com
          "
          for tls_name in ${tls_names}; do
            check "cert margin >= 21d ${tls_name}" cert_margin_ok "${tls_name}"
          done

          if [ "${FORCE_FAILURE:-false}" = "true" ]; then
            check "operator-forced failure (workflow_dispatch input)" false
          fi

          echo
          if [ "${failures}" -gt 0 ]; then
            echo "${failures} of ${checks} checks failed persistently"
            exit 1
          fi
          echo "all ${checks} checks passed"

  # GitHub disables a public repository's scheduled workflows after 60 days
  # without repository activity. Re-enabling the workflow through the REST API
  # keeps the schedule armed without commits; the private snowsys repository's
  # monitor-deadman workflow checks the result from outside (README).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/external-acceptance.yml/enable"
